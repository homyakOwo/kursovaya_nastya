name: Unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standard library unit tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q taskbot scripts tests
